# Compress JSON API responses (helps EB health + faster clients; no browser refresh needed).
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
  application/json
  application/javascript
  text/css
  text/plain
  text/xml
  application/xml
  image/svg+xml;
